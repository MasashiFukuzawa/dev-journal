[project]
name = "dev-journal"
version = "0.1.0"
description = "Development journal skill with Web UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
