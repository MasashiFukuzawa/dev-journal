name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv run ruff check .
      - run: uv run pytest
      - run: npm ci && npm audit --audit-level=high && npm run lint && npm run build
        working-directory: web
      - run: tests/smoke_server.sh
      - name: Reject private identifiers and generated runtime data
        run: |
          uv run pytest tests/test_no_private_data.py
          tests/scan_public_content.sh
          test -z "$(find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) -print)"
      - name: Scan committed history
        run: >-
          git log --all -p -- . ':!web/package-lock.json' ':!uv.lock'
          ':!tests/scan_public_content.sh' ':!tests/test_no_private_data.py'
          | tests/scan_public_content.sh --stdin
