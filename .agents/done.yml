version: 1
repo: dev-journal
verify:
  quick:
    - uv run ruff check .
    - uv run pytest
    - cd web && npm run lint && npm run build
    - tests/smoke_server.sh
  standard:
    - uv run ruff check .
    - uv run pytest
    - cd web && npm ci && npm run lint && npm run build
    - tests/smoke_server.sh
  full:
    - uv run ruff check .
    - uv run pytest
    - cd web && npm ci && npm audit --audit-level=high && npm run lint && npm run build
    - tests/smoke_server.sh
